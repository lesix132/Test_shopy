name: JobTrack

options:
  bundleIdPrefix: com.jobtrack
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # ⚠️ Replace with your own Apple Developer Team ID, or set it in Xcode.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

# `supportedDestinations` makes each of these a SINGLE multiplatform target
# (one target building for both iOS and macOS — like Xcode's "Multiplatform App"
# template), so the dependency/scheme references below resolve by plain name.
#
# App Group shared by the app and the Share Extension — keep in sync with
# Shared/Config/AppConfig.swift → AppConfig.appGroupID.
targets:
  JobTrack:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: JobTrack
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jobtrack.app
        INFOPLIST_FILE: JobTrack/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: JobTrack/Resources/JobTrack.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: ShareExtension
        embed: true

  ShareExtension:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ShareExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jobtrack.app.ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO

  JobTrackTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: JobTrackTests
    dependencies:
      - target: JobTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jobtrack.app.Tests

schemes:
  JobTrack:
    build:
      targets:
        JobTrack: all
        ShareExtension: all
    run:
      config: Debug
    test:
      targets:
        - JobTrackTests
